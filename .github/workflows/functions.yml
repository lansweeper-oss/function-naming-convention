---
name: Function lint and validate

defaults:
  run:
    shell: bash

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14.3"

permissions:
  contents: read
  pull-requests: write

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 1

      - name: Get changed folders
        id: lookup
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files_yaml: |
            docs:
              - '**/*.md'
            function:
              - '!**/package/input/inputs.yaml'
              - '!*.md'
            inputs:
              - '**/package/input/inputs.yaml'
              - '!*.md'
            yaml:
              - '**/*.yaml'
              - '**/*.yml'
    outputs:
      docs: ${{ steps.lookup.outputs.docs_any_changed }}
      function: ${{ steps.lookup.outputs.function_any_changed }}
      inputs: ${{ steps.lookup.outputs.inputs_any_changed }}
      yaml: ${{ steps.lookup.outputs.yaml_any_changed }}

  validate-function:
    needs: lookup
    runs-on: ubuntu-latest
    if: ${{
      needs.lookup.outputs.function == 'true' &&
      github.event_name == 'pull_request' && github.event.pull_request.merged != true
      }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Restore cached tools
        id: cache-tools-restore
        uses: actions/cache/restore@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6
        with:
          path: .tools
          key: ${{ runner.os }}-tools-${{ hashFiles('**/versions.mk') }}

      - name: Validate function
        run: make validate

      - name: Cache tools
        id: cache-tools-save
        uses: actions/cache/save@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6
        with:
          path: .tools
          key: ${{ steps.cache-tools-restore.outputs.cache-primary-key }}

  validate-inputs:
    needs: lookup
    runs-on: ubuntu-latest
    if: ${{
      needs.lookup.outputs.inputs == 'true' &&
      github.event_name == 'pull_request' && github.event.pull_request.merged != true
      }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Restore cached tools
        id: cache-tools-restore
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .tools
          key: ${{ runner.os }}-tools-${{ hashFiles('**/versions.mk') }}

      - name: Validate inputs
        run: make validate-inputs

      - name: Cache tools
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .tools
          key: ${{ steps.cache-tools-restore.outputs.cache-primary-key }}

  lint-docs:
    needs: lookup
    runs-on: ubuntu-latest
    if: ${{
      needs.lookup.outputs.docs == 'true' &&
      github.event_name == 'pull_request' && github.event.pull_request.merged != true
      }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Lint Markdown
        uses: actionshub/markdownlint@6c82ff529253530dfbf75c37570876c52692835f # v3.1.4
        with:
          filesToIgnoreRegex: (\..*\/.*)$

  yaml-lint:
    runs-on: ubuntu-latest
    needs: lookup
    if: ${{
      needs.lookup.outputs.yaml == 'true' &&
      github.event_name == 'pull_request' && github.event.pull_request.merged != true
      }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: pip install yamllint

      - id: yaml-lint
        name: YAML lint
        run: yamllint .
